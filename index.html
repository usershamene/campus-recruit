    const cloudOfferIds = new Set((co || []).map(r => r.id));
    const offersToUpload = offers.filter(o => !cloudOfferIds.has(o.id)).map(_offerToUpload);
    if (offersToUpload.length > 0) await sb.from('offers').upsert(offersToUpload, { onConflict: 'id' });
  } catch (e) { console.error('[sync] mergeLocalToCloud:', e); }
}

async function syncFromCloud() {
  if (!currentUser) return;
  try {
    const { data: cp } = await sb.from('progress_records').select('*').eq('user_id', currentUser.id);
    if (cp) {
      const localMap = new Map(progressRecords.map(r => [r.id, r]));
      for (const cr of cp) {
        const local = localMap.get(cr.id);
        const cloudRec = {
          id: cr.id, company: cr.company, position: cr.position, city: cr.city || '',
          applyDate: cr.apply_date || '', progress: cr.progress || '投递',
          sourceUrl: cr.source_url || '', note: cr.note || '', history: cr.history || []
        };
        if (!local) {
          progressRecords.push(cloudRec);
        } else if ((cloudRec.history || []).length > (local.history || []).length) {
          Object.assign(local, cloudRec);
        }
      }
      saveProgress();
      renderProgressPage();
    }

    const { data: co } = await sb.from('offers').select('*').eq('user_id', currentUser.id);
    if (co) {
      const offerMap = new Map(offers.map(o => [o.id, o]));
      for (const c of co) {
        if (!offerMap.has(c.id)) {
          offers.push({
            id: c.id, company: c.company, position: c.position, city: c.city || '',
            monthlySalary: c.monthly_salary, annualPackage: c.annual_package,
            signingBonus: c.signing_bonus, yearEndBonus: c.year_end_bonus || '',
            workHours: c.work_hours || '', insurance: c.insurance || '',
            housingSubsidy: c.housing_subsidy, notes: c.notes || '', createdAt: c.created_at
          });
        }
      }
      saveOffers();
      renderOffers();
    }
  } catch (e) { console.error('[sync] syncFromCloud:', e); }
}

async function syncNow() {
  if (!currentUser) { showToast('请先登录'); return; }
  showToast('同步中...');
  await mergeLocalToCloud();
  await syncFromCloud();
  showToast('同步完成');
}

// Debounced cloud writes
let _syncPTimer = null, _syncOTimer = null;

async function syncProgressToCloud() {
  if (!currentUser) return;
  try {
    const rows = progressRecords.map(_progressToUpload);
    if (rows.length > 0) await sb.from('progress_records').upsert(rows, { onConflict: 'id' });
    const localIds = new Set(rows.map(r => r.id));
    const { data: cloudRows } = await sb.from('progress_records').select('id').eq('user_id', currentUser.id);
    if (cloudRows) {
      const toDelete = cloudRows.filter(r => !localIds.has(r.id)).map(r => r.id);
      if (toDelete.length > 0) await sb.from('progress_records').delete().in('id', toDelete);
    }
  } catch (e) { console.error('[sync] syncProgressToCloud:', e); }
}

async function syncOffersToCloud() {
  if (!currentUser) return;
  try {
    const rows = offers.map(_offerToUpload);
    if (rows.length > 0) await sb.from('offers').upsert(rows, { onConflict: 'id' });
    const localIds = new Set(rows.map(r => r.id));
    const { data: cloudRows } = await sb.from('offers').select('id').eq('user_id', currentUser.id);
    if (cloudRows) {
      const toDelete = cloudRows.filter(r => !localIds.has(r.id)).map(r => r.id);
      if (toDelete.length > 0) await sb.from('offers').delete().in('id', toDelete);
    }
  } catch (e) { console.error('[sync] syncOffersToCloud:', e); }
}

// Patch save functions to auto-sync
const _origSaveProgress = saveProgress;
saveProgress = function() {
  _origSaveProgress();
  if (currentUser) { clearTimeout(_syncPTimer); _syncPTimer = setTimeout(syncProgressToCloud, 2000); }
};
const _origSaveOffers = saveOffers;
saveOffers = function() {
  _origSaveOffers();
  if (currentUser) { clearTimeout(_syncOTimer); _syncOTimer = setTimeout(syncOffersToCloud, 2000); }
};

// ── Progress page event listeners ──
document.getElementById('progressSearchInput').addEventListener('input', () => {
  clearTimeout(progressSearchTimer);
  progressSearchTimer = setTimeout(renderProgressTable, 200);
});
document.getElementById('progressStageFilter').addEventListener('change', renderProgressTable);
document.getElementById('progressSortSelect').addEventListener('change', renderProgressTable);

// Initialize Supabase auth
initAuth();
</script>
