name: Daily Data Update

on:
  schedule:
    # 每天 05:00 UTC (北京时间 13:00，考虑 GitHub 延迟约 4 小时，实际约 17:00 运行)
    - cron: '0 5 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch new job data
        run: node fetch-data.js
        id: fetch

      - name: Generate company profiles
        if: success()
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          # 检查是否有待处理的简介
          if [ -f "data/pending-profiles.json" ]; then
            PENDING=$(cat data/pending-profiles.json)
            if [ "$PENDING" != "[]" ] && [ -n "$PENDING" ]; then
              echo "Generating profiles for new companies..."
              node generate-profiles.js
            else
              echo "No new profiles to generate"
            fi
          else
            echo "No pending profiles file found"
          fi

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          DATE=$(date +%Y-%m-%d)
          git commit -m "feat: 自动更新校招数据 ($DATE)"
          git push
